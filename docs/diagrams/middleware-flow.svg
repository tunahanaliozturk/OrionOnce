<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040">
  <!--
    Orion family diagram template. Copy it, keep <defs> and <style>, replace the body.
    Classes: .step (our code) .ext (backend / external system) .ok (success end) .fail (failure path)
             .decision (diamond) .note (side remark) .lane (sequence lifeline)
    Arrows: class="flow" (main path), "flow alt" (alternate / failure path, dashed), "flow back" (response).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="1040" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionOnce - what the middleware does with one request</text>
  <text class="subtitle" x="40" y="78">IdempotencyMiddleware.InvokeAsync: three gates, one atomic claim, then replay, reject, or run the handler once and capture it.</text>

  <!-- spine 1: gates -->
  <rect class="step" x="40" y="165" width="135" height="70" rx="14"/>
  <text class="label" x="107" y="196" text-anchor="middle">Request</text>
  <text class="small" x="107" y="218" text-anchor="middle">any method</text>
  <path class="flow" d="M175,200 L223,200"/>

  <polygon class="decision" points="320,145 415,200 320,255 225,200"/>
  <text class="small" x="320" y="194" text-anchor="middle">method in</text>
  <text class="code" x="320" y="214" text-anchor="middle">Methods?</text>
  <path class="flow" d="M415,200 L448,200"/>
  <text class="edge" x="431" y="190" text-anchor="middle">yes</text>

  <polygon class="decision" points="545,145 640,200 545,255 450,200"/>
  <text class="small" x="545" y="194" text-anchor="middle">key header</text>
  <text class="code" x="545" y="214" text-anchor="middle">HeaderName?</text>
  <path class="flow" d="M640,200 L673,200"/>
  <text class="edge" x="656" y="190" text-anchor="middle">yes</text>

  <polygon class="decision" points="770,145 865,200 770,255 675,200"/>
  <text class="small" x="770" y="194" text-anchor="middle">body within</text>
  <text class="code" x="770" y="214" text-anchor="middle">MaxBodyBytes?</text>
  <path class="flow" d="M865,200 L903,200"/>
  <text class="edge" x="884" y="190" text-anchor="middle">yes</text>

  <rect class="step" x="905" y="155" width="255" height="90" rx="14"/>
  <text class="label" x="1032" y="180" text-anchor="middle">Fingerprint + claim</text>
  <text class="code" x="1032" y="204" text-anchor="middle">RequestFingerprint.Compute</text>
  <text class="code" x="1032" y="228" text-anchor="middle">AcquireAsync(key, fp)</text>

  <!-- gate exits -->
  <path class="flow" d="M320,255 L320,303"/>
  <text class="edge" x="332" y="284">no</text>
  <rect class="step" x="225" y="305" width="190" height="70" rx="14"/>
  <text class="label" x="320" y="334" text-anchor="middle">Handled normally</text>
  <text class="code" x="320" y="358" text-anchor="middle">next(context)</text>

  <path class="flow" d="M545,255 L545,293"/>
  <text class="edge" x="557" y="280">no key</text>
  <polygon class="decision" points="545,295 630,340 545,385 460,340"/>
  <text class="code" x="545" y="345" text-anchor="middle">RequireKey?</text>
  <path class="flow" d="M460,340 L417,340"/>
  <text class="edge" x="438" y="394" text-anchor="middle">false:</text>
  <text class="edge" x="438" y="410" text-anchor="middle">bypassed</text>
  <path class="flow alt" d="M545,385 L545,418"/>
  <text class="edge" x="557" y="406">true</text>
  <rect class="fail" x="455" y="420" width="180" height="62" rx="14"/>
  <text class="label" x="545" y="446" text-anchor="middle">400 Bad Request</text>
  <text class="code" x="545" y="468" text-anchor="middle">missing_key</text>

  <path class="flow alt" d="M770,255 L770,303"/>
  <text class="edge" x="782" y="284">too large</text>
  <rect class="fail" x="680" y="305" width="180" height="70" rx="14"/>
  <text class="label" x="770" y="334" text-anchor="middle">413 Payload Too Large</text>
  <text class="small" x="770" y="356" text-anchor="middle">no metric recorded</text>

  <!-- lease outcome switch -->
  <path class="flow" d="M1032,245 L1032,313"/>
  <polygon class="decision" points="1032,315 1132,370 1032,425 932,370"/>
  <text class="code" x="1032" y="375" text-anchor="middle">lease.Outcome</text>

  <path d="M1032,500 L180,500" fill="none" stroke="#64748b" stroke-width="2"/>
  <path class="flow" d="M1032,425 L1032,538"/>
  <path class="flow" d="M180,500 L180,538"/>
  <path class="flow alt" d="M450,502 L450,538"/>
  <path class="flow alt" d="M720,502 L720,538"/>
  <text class="code" x="192" y="526">AlreadyCompleted</text>
  <text class="code" x="462" y="526">InProgress</text>
  <text class="code" x="732" y="526">FingerprintMismatch</text>
  <text class="code" x="1044" y="526">Acquired</text>

  <rect class="ok" x="60" y="540" width="240" height="84" rx="14"/>
  <text class="label" x="180" y="566" text-anchor="middle">Replay stored response</text>
  <text class="code" x="180" y="590" text-anchor="middle">Idempotency-Replayed: true</text>
  <text class="small" x="180" y="611" text-anchor="middle">handler skipped, metric replayed</text>

  <rect class="fail" x="340" y="540" width="220" height="84" rx="14"/>
  <text class="label" x="450" y="566" text-anchor="middle">409 Conflict</text>
  <text class="small" x="450" y="589" text-anchor="middle">same key still in flight</text>
  <text class="code" x="450" y="611" text-anchor="middle">in_progress</text>

  <rect class="fail" x="600" y="540" width="240" height="84" rx="14"/>
  <text class="label" x="720" y="566" text-anchor="middle">422 Unprocessable Entity</text>
  <text class="small" x="720" y="589" text-anchor="middle">same key, different request</text>
  <text class="code" x="720" y="611" text-anchor="middle">mismatch</text>

  <rect class="step" x="905" y="540" width="255" height="84" rx="14"/>
  <text class="label" x="1032" y="566" text-anchor="middle">Run the handler once</text>
  <text class="code" x="1032" y="589" text-anchor="middle">next(context)</text>
  <text class="small" x="1032" y="611" text-anchor="middle">response body buffered</text>

  <!-- capture -->
  <path class="flow" d="M1032,624 L1032,648"/>
  <polygon class="decision" points="1032,650 1127,700 1032,750 937,700"/>
  <text class="small" x="1032" y="705" text-anchor="middle">handler threw?</text>
  <path class="flow alt" d="M937,700 L842,700"/>
  <text class="edge" x="889" y="690" text-anchor="middle">throws</text>
  <rect class="fail" x="600" y="665" width="240" height="70" rx="14"/>
  <text class="code" x="720" y="694" text-anchor="middle">ReleaseAsync, rethrow</text>
  <text class="small" x="720" y="717" text-anchor="middle">nothing cached, the key is free</text>

  <path class="flow" d="M1032,750 L1032,788"/>
  <text class="edge" x="1044" y="774">no</text>
  <polygon class="decision" points="1032,790 1127,840 1032,890 937,840"/>
  <text class="small" x="1032" y="835" text-anchor="middle">status</text>
  <text class="code" x="1032" y="853" text-anchor="middle" style="font-variant-ligatures: none">&gt;= 500?</text>
  <path class="flow alt" d="M937,840 L842,840"/>
  <text class="edge" x="889" y="830" text-anchor="middle">yes</text>
  <rect class="fail" x="600" y="805" width="240" height="70" rx="14"/>
  <text class="code" x="720" y="834" text-anchor="middle">ReleaseAsync</text>
  <text class="small" x="720" y="857" text-anchor="middle">5xx sent but not cached</text>

  <path class="flow" d="M1032,890 L1032,928"/>
  <text class="edge" x="1044" y="914">no</text>
  <rect class="ok" x="905" y="930" width="255" height="80" rx="14"/>
  <text class="code" x="1032" y="958" text-anchor="middle">CompleteAsync</text>
  <text class="small" x="1032" y="980" text-anchor="middle">status, content type, body stored</text>
  <text class="small" x="1032" y="999" text-anchor="middle">every later retry replays it</text>

  <!-- note -->
  <rect class="note" x="60" y="665" width="500" height="142" rx="10"/>
  <text class="small" x="78" y="693">A released key can be retried with the same Idempotency-Key.</text>
  <text class="small" x="78" y="717">Each guarded request records one orion.once.requests measurement</text>
  <text class="small" x="78" y="739">tagged orion.outcome; unguarded methods and 413 record none.</text>
  <text class="small" x="78" y="763">Entries live for Retention (default 24 hours); after that the key</text>
  <text class="small" x="78" y="785">is claimed afresh as if it had never been seen.</text>
</svg>
